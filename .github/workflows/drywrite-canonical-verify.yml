name: DryWrite Canonical Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - integration/canonical-clean-20260827
      - preview/canonical-clean-20260827

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Canonical front contract guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "bots-git-feat-persona-language" FrontLanguageBotBridge.tsx; then
            echo "Hardcoded preview bot endpoint is forbidden"
            exit 1
          fi
          grep -q "VITE_BOTS_FRONT_URL" FrontLanguageBotBridge.tsx
          grep -q "DryWriter landing" components/HomeView.tsx
          grep -q "drywrite-library" components/HomeView.tsx
