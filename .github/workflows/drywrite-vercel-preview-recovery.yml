name: DryWrite Vercel Preview Recovery

on:
  push:
    branches:
      - integration/canonical-clean-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 2
          fi
      - name: Link canonical Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_TujTxCfsmFUlUS7lfY1DFLMN","projectId":"prj_FAx5QjSY9xEws50VCfXmOrb6hBRU"}' > .vercel/project.json
      - name: Deploy latest candidate Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN"
